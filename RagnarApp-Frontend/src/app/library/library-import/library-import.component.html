<main class="min-h-screen bg-slate-950 px-4 py-10 text-slate-100 sm:px-6 lg:px-8">
	<section class="mx-auto max-w-3xl">
		<div class="mb-8">
			<p class="mb-2 text-sm font-semibold uppercase tracking-[0.2em] text-cyan-400">Library</p>
			<h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">Import books</h1>
			<p class="mt-2 text-slate-400">Drop a file here to prepare it for import.</p>
		</div>

		<label
			for="library-file"
			[class]="isDragging
				? 'flex min-h-72 scale-105 cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-cyan-400 bg-cyan-400/10 p-8 text-center transition duration-200'
				: 'flex min-h-72 cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-slate-700 bg-slate-900 p-8 text-center transition duration-200'"
			(dragover)="onDragOver($event)"
			(dragleave)="onDragLeave($event)"
			(drop)="onDrop($event)">
			<input
				id="library-file"
				type="file"
				accept=".csv,text/csv"
				class="sr-only"
				(change)="onFileSelected($event)" />

			<div class="mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-slate-800 text-2xl text-cyan-400">
				&#8593;
			</div>

			@if (isDragging) {
				<p class="text-lg font-semibold text-cyan-300">Release to add your file</p>
			} @else if (selectedFile) {
				<p class="text-lg font-semibold text-white">{{ selectedFile.name }}</p>
				@if (isUploading) {
					<p class="mt-2 text-sm text-cyan-400">Uploading file...</p>
				} @else if (uploadError) {
					<p class="mt-2 text-sm text-red-300">{{ uploadError }}</p>
				} @else {
					<p class="mt-2 text-sm text-emerald-400">{{ uploadMessage || 'File selected' }}</p>
				}
			} @else if (invalidFile) {
				<p class="text-lg font-semibold text-red-300">Unsupported file type</p>
				<p class="mt-2 text-sm text-slate-400">Please select a CSV file.</p>
			} @else {
				<p class="text-lg font-semibold text-white">Drag and drop your file here</p>
				<p class="mt-2 text-sm text-slate-400">CSV files only</p>
			}
		</label>
	</section>
</main>
