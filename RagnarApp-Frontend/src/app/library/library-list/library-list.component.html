<section class="min-h-screen bg-slate-950 px-4 py-10 text-slate-100 sm:px-6 lg:px-8">
	<div class="mx-auto max-w-5xl">
		<div class="mb-8 border-b border-slate-800 pb-6">
			<p class="mb-2 text-sm font-semibold uppercase tracking-[0.2em] text-cyan-400">Collection</p>
			<h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">Library</h1>
			<p class="mt-2 text-slate-400">Here is the list with all the books in the library.</p>
		</div>

		@if (books.length === 0) {
			<div class="rounded-xl border border-dashed border-slate-700 bg-slate-900/70 px-6 py-12 text-center">
				<p class="text-lg font-medium text-slate-200">No libraries found.</p>
				<p class="mt-2 text-sm text-slate-500">Imported books will appear here.</p>
			</div>
		} @else {
			<ul class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
				@for (book of books; track book.id) {
					<li class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-lg shadow-slate-950/30 transition hover:-translate-y-0.5 hover:border-cyan-500/60">
						<h2 class="truncate text-lg font-semibold text-white">{{ book.name }}</h2>
						<p class="mt-2 text-sm text-slate-300">{{ book.author }}</p>
						<p class="mt-4 text-xs font-semibold uppercase tracking-wide text-cyan-400">{{ book.genre }}</p>
					</li>
				}
			</ul>
		}
	</div>
</section>
